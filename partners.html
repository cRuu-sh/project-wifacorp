<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Partners | WIFA CORP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800">

    <section class="bg-gray-900 py-20">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Partner Kami</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">Kami berkolaborasi dengan perusahaan-perusahaan terkemuka untuk
                memastikan kualitas dan layanan terbaik bagi setiap klien kami.</p>
        </div>
    </section>

    <main class="container mx-auto px-6 py-16">

        <section class="mb-24">
            <div class="flex items-center mb-10">
                <h2 class="text-2xl font-bold text-red-600 mr-4">Material Suppliers</h2>
                <div class="flex-1 h-[2px] bg-gray-200"></div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
                <div class="group border p-4 rounded-lg hover:shadow-lg transition">
                    <img src="https://via.placeholder.com/200x100?text=Krakatau+Steel" alt="Logo"
                        class="h-16 w-full object-contain grayscale group-hover:grayscale-0 transition">
                    <p class="text-xs text-center mt-2 text-gray-500">PT. Krakatau Steel Tbk.</p>
                </div>
            </div>
        </section>

        <section class="mb-24">
            <div class="flex items-center mb-10">
                <h2 class="text-2xl font-bold text-blue-600 mr-4">Healthcare & Pharmaceutical</h2>
                <div class="flex-1 h-[2px] bg-gray-200"></div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
                <div class="group border p-4 rounded-lg hover:shadow-lg transition">
                    <img src="https://via.placeholder.com/200x100?text=Sanbe+Farma" alt="Logo"
                        class="h-16 w-full object-contain grayscale group-hover:grayscale-0 transition">
                    <p class="text-xs text-center mt-2 text-gray-500">Sanbe Farma</p>
                </div>
            </div>
        </section>

        <section class="mb-24">
            <div class="flex items-center mb-10">
                <h2 class="text-2xl font-bold text-green-600 mr-4">General Trading</h2>
                <div class="flex-1 h-[2px] bg-gray-200"></div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                <div class="group border p-4 rounded-lg hover:shadow-lg transition">
                    <img src="https://via.placeholder.com/200x100?text=Antam" alt="Logo"
                        class="h-12 w-full object-contain grayscale group-hover:grayscale-0 transition">
                    <p class="text-[10px] text-center mt-2 text-gray-500 uppercase">Antam</p>
                </div>
            </div>
        </section>

        <section class="py-12 bg-gray-50 rounded-2xl text-center">
            <h2 class="text-xl font-semibold text-gray-400 italic">Agrobusiness Division - Coming Soon</h2>
        </section>

    </main>

</body>

</html>
